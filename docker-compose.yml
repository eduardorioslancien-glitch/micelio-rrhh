services:
  micelio:
    build: .
    container_name: micelio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - RRHH_SECRET_KEY=${RRHH_SECRET_KEY}
      # Correo saliente (coordinar Meet, descartar, enlace de autoservicio al
      # aprobar un lead, etc.) — los valores reales van en .env del
      # servidor, nunca en este archivo:
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Clave compartida para /api/leads y /api/pedidos-abiertos (usada por
      # n8n u otra automatización externa para centralizar leads de correo
      # o WhatsApp) — el valor real va en .env del servidor, nunca aquí:
      - LEADS_API_KEY=${LEADS_API_KEY:-}
      - TRABAJA_CON_NOSOTROS_EMAIL=trabajaconnosotros@digetelperu.com
      # - PUBLIC_BASE_URL=https://micelio.digetelperu.com
      # Integración con Man Academy (menú Capacitación): URL pública de esa
      # app y un secreto largo y aleatorio compartido con ella (mismo valor
      # en su .env allá, como MAN_ACADEMY_SSO_SECRET) para que MICELIO le
      # firme el ingreso sin clave (SSO) y le diga a qué cursos/rutas puede
      # entrar cada trabajador. Sin estos dos, el enlace queda deshabilitado
      # ("Falta URL"). El valor real del secreto va en .env del servidor,
      # nunca en este archivo.
      - MAN_ACADEMY_URL=https://manacademylatam.com
      - MAN_ACADEMY_SSO_SECRET=${MAN_ACADEMY_SSO_SECRET:-}
    volumes:
      # Todo lo que la app escribe en tiempo de ejecución (base de datos,
      # PDFs firmados, adjuntos, fotos, firmas) queda en el host — así
      # `docker compose down` / reconstruir la imagen no borra nada.
      - ./data:/app/data
      - ./app/generated:/app/app/generated
      - ./app/uploads:/app/app/uploads
      - ./app/fotos:/app/app/fotos
      - ./app/signatures:/app/app/signatures
      - ./app/firmas_empresa:/app/app/firmas_empresa
      - ./app/cv_postulantes:/app/app/cv_postulantes
      - ./app/anuncios_imagenes:/app/app/anuncios_imagenes
