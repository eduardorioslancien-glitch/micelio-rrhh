<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agregar trabajador — MICELIO</title>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
{% include "_rrhh_topbar.html" %}

  <div class="card" style="max-width:560px;">
    <h2>Agregar trabajador directamente a la BD maestra</h2>
    <p class="muted">Úsalo para personal que ya trabaja en el grupo y no pasó por el proceso de Selección digital. Después podrás completar su ficha, foto, bitácora y documentos desde su perfil.</p>
    <form method="post" action="/rrhh/personal/nuevo">
      <div class="field"><label>Nombre completo</label><input type="text" name="nombre_completo" required></div>
      <div class="field"><label>Correo (opcional)</label><input type="email" name="email"></div>
      <div class="field">
        <label>Empresa</label>
        <select name="empresa_id" required>
          {% for e in empresas %}<option value="{{ e.id }}">{{ e.nombre }}</option>{% endfor %}
        </select>
      </div>
      <button class="btn" type="submit">Crear</button>
      <a class="btn secondary" href="/rrhh/personal">Cancelar</a>
    </form>
  </div>

</div>
</body>
</html>
