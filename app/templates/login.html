<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — MICELIO</title>
<link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
<div class="login-page">
  <div class="login-art"><img src="/static/micelio_art.png" alt="MICELIO"></div>
  <div class="login-wrap">
    <div class="logo-row"><img src="/static/dg_logo.png" alt="DG"></div>
    <div class="card">
      <h2 style="text-align:center;">MICELIO</h2>
      <p class="muted" style="text-align:center; margin-top:-8px;">Sistema de Recursos Humanos DIGETEL GROUP</p>
      {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field"><label>Usuario</label><input type="text" name="username" required autofocus></div>
        <div class="field"><label>Contraseña</label><input type="password" name="password" required></div>
        <button class="btn" type="submit" style="width:100%;">Ingresar</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
